services:
  app:
    # Utilise l'image publiée sur Docker Hub si elle existe déjà en local;
    # `docker compose build` (ou `up --build`) reconstruit depuis ce repo.
    image: vlaine/myges-cli:latest
    build: .
    container_name: myges-app
    env_file:
      - .env
    environment:
      APP_SECRET: ${APP_SECRET:-local-docker-secret-change-me}
    ports:
      # Port externe personnalisable par deploiement (ex: MYGES_PORT=3051 dans .env).
      - "${MYGES_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"