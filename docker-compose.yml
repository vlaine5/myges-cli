services:
  app:
    # Utilise l'image publiée sur Docker Hub si elle existe déjà en local;
    # `docker compose build` (ou `up --build`) reconstruit depuis ce repo.
    image: vlaine/myges-cli:latest
    build: .
    container_name: myges-app
    env_file:
      - .env
    # Liste explicite (plutot que de compter uniquement sur env_file) afin que
    # les memes variables fonctionnent aussi bien avec `docker compose up` en
    # CLI qu'avec les "Environment variables" d'un stack Portainer, qui ne
    # sont injectees dans le conteneur que si elles sont referencees ici.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-local-docker-secret-change-me}
      DATABASE_URL: ${DATABASE_URL:-file:./data/app.db}
      APP_DATA_DIR: ${APP_DATA_DIR:-./data}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-https://www.googleapis.com/auth/calendar}
      ACADEMIC_PROVIDER: ${ACADEMIC_PROVIDER:-myges}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-7}
      SYNC_FUTURE_DAYS: ${SYNC_FUTURE_DAYS:-30}
      SYNC_FREQUENCY_MINUTES: ${SYNC_FREQUENCY_MINUTES:-30}
      SYNC_RUN_ON_STARTUP: ${SYNC_RUN_ON_STARTUP:-false}
      GOOGLE_SYNC_ENABLED: ${GOOGLE_SYNC_ENABLED:-false}
      SAVE_LAST_ICS: ${SAVE_LAST_ICS:-true}
      STORE_RAW_PAYLOAD: ${STORE_RAW_PAYLOAD:-false}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      MYGES_USERNAME: ${MYGES_USERNAME:-}
      MYGES_PASSWORD: ${MYGES_PASSWORD:-}
      MYEFREI_USERNAME: ${MYEFREI_USERNAME:-}
      MYEFREI_PASSWORD: ${MYEFREI_PASSWORD:-}
      MYEFREI_SESSION_COOKIE: ${MYEFREI_SESSION_COOKIE:-}
      MYEFREI_AGENDA_ENDPOINT: ${MYEFREI_AGENDA_ENDPOINT:-}
      ENSUP_USERNAME: ${ENSUP_USERNAME:-}
      ENSUP_PASSWORD: ${ENSUP_PASSWORD:-}
      ENSUP_SESSION_COOKIE: ${ENSUP_SESSION_COOKIE:-}
      ENSUP_AGENDA_ENDPOINT: ${ENSUP_AGENDA_ENDPOINT:-}
      ENSUP_ICS_URL: ${ENSUP_ICS_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      GOOGLE_DEFAULT_CALENDAR_ID: ${GOOGLE_DEFAULT_CALENDAR_ID:-}
    ports:
      # Port externe personnalisable par deploiement (ex: MYGES_PORT=3051 dans .env).
      - "${MYGES_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"